name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suite runs on Node's built-in test runner, but the online
      # server/tests import the `ws` package (added in R60), so
      # dependencies must be installed first. Without this step CI
      # failed with "Cannot find package 'ws'" while local runs passed.
      - run: npm ci
      # Lint catches what the test runner cannot: an `import` that was pasted inside a
      # JSDoc block left getLang undefined in gachaView.js, crashing every card reveal,
      # while the whole suite stayed green because no test rendered a reveal.
      - run: npm run lint
      - run: npm test
